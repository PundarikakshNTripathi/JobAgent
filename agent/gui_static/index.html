<style>
/* JobAgent design system: warm paper and ink, one pine accent (the logo), marigold only for "needs you".
   Display type is a serif (Instrument Serif) for the human parts; Geist for UI; Geist Mono for numbers, ids and times. */
:root{color-scheme:light;
 --bg:#f3f1ec;--panel:#fbfaf7;--raise:#ffffff;--sunken:#ebe8e1;--line:#dfdbd1;--line2:#e8e5dd;--text:#1b1a16;--text2:#3b3933;--mut:#76726a;--faint:#a29e94;
 --ink:#1b1a16;--on-ink:#f6f4ef;--acc:#2a6352;--acc-h:#1f4f41;--acc-soft:#e2ece6;--ok:#2a6352;--ok-soft:#e2ece6;--warn:#9a5b09;--warn-soft:#f6ead3;--gold:#d9a23e;--bad:#a23a2e;--bad-soft:#f5e3df;
 --ring:#e2ded5;--sh:0 1px 0 rgba(43,36,20,.04);--sh2:0 24px 60px -18px rgba(43,36,20,.28),0 2px 6px -2px rgba(43,36,20,.08);--hi:inset 0 1px 0 rgba(255,255,255,.7);
 --r:14px;--r2:9px;--r3:6px;--ease:cubic-bezier(.2,.8,.2,1);

 --z-top:20;--z-pop:40;--z-scrim:50;--z-drawer:60;--z-side:70;--z-toast:95;--z-pal:97;--z-modal:98;--z-tour:100}
:root[data-theme=dark]{color-scheme:dark;
 --bg:#121110;--panel:#191816;--raise:#1f1e1b;--sunken:#23221e;--line:#2e2c27;--line2:#262521;--text:#ecebe5;--text2:#cdcac1;--mut:#8f8b81;--faint:#66635b;
 --ink:#ecebe5;--on-ink:#141311;--acc:#7cbca3;--acc-h:#97cfb9;--acc-soft:#1d2b25;--ok:#7cbca3;--ok-soft:#1d2b25;--warn:#e3ac52;--warn-soft:#2d2414;--gold:#e3ac52;--bad:#e5877a;--bad-soft:#2f1c18;
 --ring:#2c2a25;--sh:none;--sh2:0 24px 60px -18px rgba(0,0,0,.7),0 2px 6px -2px rgba(0,0,0,.4);--hi:inset 0 1px 0 rgba(255,255,255,.04)}
*{box-sizing:border-box}html,body{height:100%}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"ss01","cv11"}
/* paper grain: breaks the digital flatness without being seen as a pattern */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.35;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
:root[data-theme=dark] body::after{mix-blend-mode:screen;opacity:.25}
::selection{background:color-mix(in srgb,var(--acc) 22%,transparent)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--acc);text-decoration:none;transition:color .15s}a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--ink);color:var(--on-ink);padding:8px 12px;border-radius:8px}.skip:focus{left:12px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%;position:relative;z-index:2}
/* sidebar: a quiet index, not a control panel */
aside::-webkit-scrollbar{display:none}
aside{scrollbar-width:none;background:transparent;border-right:1px solid var(--line);padding:22px 12px 16px;position:sticky;top:0;height:100dvh;overflow:auto;display:flex;flex-direction:column;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 24px;font:400 25px/1 var(--fd);letter-spacing:-.01em;color:var(--text)}.brand img{width:26px;height:26px;border-radius:7px}
.grp{font:500 10.5px/1 var(--fm);color:var(--faint);padding:20px 12px 8px;letter-spacing:.06em;text-transform:uppercase}
nav button{position:relative;width:100%;display:flex;align-items:center;gap:11px;height:33px;background:none;border:0;border-radius:8px;padding:0 12px;text-align:left;color:var(--text2);font-weight:450;font-size:13.5px;transition:background .15s,color .15s}
nav button svg{color:var(--faint);transition:color .15s}nav button:hover{background:color-mix(in srgb,var(--sunken) 70%,transparent);color:var(--text)}nav button:hover svg{color:var(--mut)}
nav button.on{background:var(--panel);color:var(--text);font-weight:550;box-shadow:0 0 0 1px var(--line2),var(--hi)}nav button.on svg{color:var(--acc)}
nav .n{margin-left:auto;font:500 11px/1 var(--fm);color:var(--faint)}nav button.on .n{color:var(--acc)}
.side-foot{margin-top:auto;padding:16px 12px 2px;color:var(--mut);font-size:12px;line-height:1.75;border-top:1px solid var(--line2)}
.side-foot .motto{margin-top:10px;font:italic 400 15px/1.2 var(--fd);color:var(--faint)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:1px}.dot.off{background:var(--bad)}.dot.pause{background:var(--gold)}
/* main column */
main{padding:0 44px 110px;min-width:0;max-width:1200px;width:100%;margin:0 auto}
.top{position:sticky;top:0;z-index:var(--z-top);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);padding:16px 0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid transparent}
.search{flex:1;min-width:200px;position:relative}.search svg{position:absolute;left:13px;top:11px;color:var(--faint)}
.search input{width:100%;height:38px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 74px 0 38px;box-shadow:var(--hi)}
.search kbd{position:absolute;right:9px;top:9px;cursor:pointer}
kbd{font:500 10.5px/1 var(--fm);color:var(--mut);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;background:var(--raise)}
input:focus,select:focus,textarea:focus{outline:none;border-color:color-mix(in srgb,var(--acc) 60%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}
/* controls: ink for the one thing to do, quiet hairlines for the rest */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);font-weight:500;font-size:13px;color:var(--text);white-space:nowrap;text-decoration:none!important;box-shadow:var(--hi);transition:background .18s var(--ease),border-color .18s,transform .12s var(--ease),box-shadow .18s}
.btn:hover{border-color:color-mix(in srgb,var(--text) 26%,var(--line));background:var(--raise)}.btn:active{transform:translateY(1px) scale(.985)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:550;box-shadow:0 1px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.12)}.btn.pri:hover{background:color-mix(in srgb,var(--ink) 86%,var(--acc));border-color:transparent}
.btn.ok{color:var(--ok)}.btn.warn{color:var(--warn)}.btn.sm{height:29px;padding:0 11px;font-size:12.5px;border-radius:8px}.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}.btn.ghost:hover{background:var(--sunken)}
.btn.sq{width:34px;padding:0;justify-content:center}.btn.sm.sq{width:29px}.btn[disabled]{opacity:.4;cursor:default;transform:none}
.btn.link{background:none;border:0;box-shadow:none;padding:0 2px;height:auto;color:var(--acc);font-weight:500}.btn.link:hover{text-decoration:underline;text-underline-offset:3px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:7px 11px;width:100%;min-height:36px;transition:border-color .15s,box-shadow .15s}
select{width:auto;max-width:100%}textarea{resize:vertical;min-height:90px;line-height:1.5}input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--acc)}
.menu{position:relative;display:inline-block}.pop{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2),var(--hi);padding:6px;min-width:228px;z-index:var(--z-pop);transform-origin:top right}
.menu.open .pop{display:block;animation:popin .16s var(--ease)}@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.pop button,.pop a{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:8px 10px;color:var(--text);font-size:13px;text-decoration:none}.pop button:hover,.pop a:hover{background:var(--sunken);text-decoration:none}.pop hr{border:0;border-top:1px solid var(--line2);margin:5px 0}
/* tags: labels, not candy. Hairline by default; colour only where it carries status */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;line-height:1;font-weight:500;padding:5px 7px;border-radius:var(--r3);background:transparent;color:var(--text2);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.tag.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.tag.ai::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.badge{font:500 11px/1 var(--fm);padding:4px 8px;border-radius:var(--r3)}.badge.on{background:var(--ok-soft);color:var(--ok)}.badge.off{background:var(--bad-soft);color:var(--bad)}.badge.exp{background:var(--warn-soft);color:var(--warn)}
.pill{font-size:12px;font-weight:500;border-radius:var(--r3);padding:2px 8px;background:var(--sunken);color:var(--text2)}
h2{font:400 42px/1.05 var(--fd);letter-spacing:-.015em;margin:22px 0 8px;text-wrap:balance}h2 em{font-style:italic;color:var(--acc)}
h3{font-size:14.5px;font-weight:600;margin:28px 0 10px;letter-spacing:-.005em}.sub{color:var(--mut);margin:0 0 26px;max-width:66ch;font-size:14.5px;text-wrap:pretty}
.sect{margin:40px 0 12px;font-weight:600;font-size:14px;color:var(--text);display:flex;align-items:baseline;gap:10px}.sect::after{content:"";flex:1;border-top:1px solid var(--line2);transform:translateY(-4px)}
.tm{color:var(--mut);font-size:12.5px}code{background:var(--sunken);padding:1px 6px;border-radius:5px;font:12px var(--fm)}
.mono,.ts{font-family:var(--fm);font-feature-settings:normal;letter-spacing:-.01em}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:11px 16px;margin:4px 0 18px;font-weight:500}
/* surfaces */
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:20px 22px;box-shadow:var(--hi)}
.list{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--hi);overflow:hidden}
.grid{display:grid;gap:14px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.job{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:18px;padding:19px 22px 20px;border-bottom:1px solid var(--line2);align-items:start;transition:background .18s}.list .job:last-child{border-bottom:0}.job:hover{background:color-mix(in srgb,var(--raise) 70%,var(--panel))}
.list>.job{animation:rise .42s var(--ease) both}.list>.job:nth-child(2){animation-delay:.03s}.list>.job:nth-child(3){animation-delay:.06s}.list>.job:nth-child(4){animation-delay:.09s}.list>.job:nth-child(5){animation-delay:.12s}.list>.job:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.lg{position:relative;width:42px;height:42px;border-radius:11px;background:var(--sunken);display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px var(--line2)}
.lg b{font:400 21px/1 var(--fd);color:var(--text2)}.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7px;background:#fff}.lg.sm{width:34px;height:34px;border-radius:9px}
.jt{font-weight:600;font-size:15.5px;line-height:1.35;letter-spacing:-.012em;text-wrap:pretty}.jt a{color:var(--text)}.jt a:hover{color:var(--acc);text-decoration:none}.jt svg{width:13px;height:13px;color:var(--faint);vertical-align:-1px;margin-left:5px}
.jm{color:var(--mut);font-size:13px;margin-top:3px;display:flex;flex-wrap:wrap;column-gap:0;row-gap:2px}.jm:not(.people)>span+span::before{content:"·";margin:0 8px;color:var(--faint)}
.posted{font-family:var(--fm);font-size:12px;letter-spacing:-.01em}.posted.fresh{color:var(--acc)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}.why{color:var(--text2);font-size:13.5px;margin-top:11px;max-width:74ch;line-height:1.58;text-wrap:pretty}
.jr{display:flex;flex-direction:column;align-items:flex-end;gap:14px;min-width:150px}.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
/* fit: a number you can read at a glance, with a hairline meter under it */
.mt{display:flex;align-items:flex-end;gap:10px}.mt small{color:var(--faint);font:500 10.5px/1.2 var(--fm);display:block;text-align:right;letter-spacing:.02em;margin-bottom:5px}
.mt .gauge{--v:0;width:48px;display:block;text-align:right}.mt .gauge b{font:400 30px/1 var(--fd);letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}

.empty{padding:68px 20px;text-align:center;color:var(--mut)}.empty svg{width:28px;height:28px;color:var(--faint);margin-bottom:12px;stroke-width:1.3}.empty .big{font:italic 400 24px/1.2 var(--fd);color:var(--text2);margin-bottom:6px}
/* today: the next action is the headline */
.hero{margin:26px 0 30px}.hero .hello{font:500 11px/1 var(--fm);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:0 0 14px}
.hero .lead{font:400 clamp(38px,5vw,60px)/1.02 var(--fd);letter-spacing:-.02em;margin:0;max-width:19ch;text-wrap:balance}.hero .lead em{font-style:italic;color:var(--acc)}
.hero .meta{color:var(--mut);margin-top:16px;display:flex;flex-wrap:wrap;gap:6px 0;font-size:13px}.hero .meta>span+span::before{content:"·";margin:0 10px;color:var(--faint)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-bottom:6px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);overflow:hidden;box-shadow:var(--hi)}
.tile{padding:16px 20px 18px;cursor:pointer;border-right:1px solid var(--line2);transition:background .18s}.tile:last-child{border-right:0}.tile:hover{background:var(--raise)}
.tile span{display:block;color:var(--mut);font-size:12.5px}.tile b{display:block;font:400 38px/1.15 var(--fd);letter-spacing:-.02em;margin-top:2px}
.task{display:flex;gap:13px;align-items:flex-start;padding:16px 22px;border-bottom:1px solid var(--line2);transition:opacity .2s}.list .task:last-child{border-bottom:0}.task input{margin-top:4px;width:16px;height:16px}.task.done{opacity:.45}.task.done .tt{text-decoration:line-through;text-decoration-thickness:1px}.tt{font-weight:600}
.thought{border-left:2px solid var(--acc);color:var(--text2);padding:4px 0 4px 18px;margin-top:22px;font:italic 400 19px/1.45 var(--fd);max-width:62ch}

.fchk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text);padding:3px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:middle}th{color:var(--faint);font:500 10.5px/1 var(--fm);letter-spacing:.05em;text-transform:uppercase;padding-top:4px}td input,td select{min-height:31px;padding:3px 8px}
tr:last-child td{border-bottom:0}td.num,th.num{text-align:right;font-family:var(--fm);font-size:12.5px}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px}.bars div{flex:1;background:var(--sunken);border-radius:3px 3px 0 0;position:relative;min-height:3px}.bars div i{position:absolute;bottom:0;left:0;right:0;background:var(--acc);border-radius:3px 3px 0 0;opacity:.85}
.board{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}.fpanel{position:sticky;top:78px;max-height:calc(100dvh - 98px);overflow:auto;padding:18px;scrollbar-width:thin}
.achips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.achip{display:inline-flex;align-items:center;gap:6px;background:var(--acc-soft);color:var(--acc);border-radius:var(--r3);padding:4px 6px 4px 10px;font-size:12.5px;font-weight:500}.achip button{background:none;border:0;color:inherit;padding:0 3px;line-height:1;font-size:14px}
/* chat: threads on the left, the conversation reads like a document */
.chatwrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.threads{position:sticky;top:78px;display:flex;flex-direction:column;gap:2px;max-height:calc(100dvh - 110px);overflow:auto;scrollbar-width:thin}
.threads .newt{margin-bottom:8px;justify-content:center}
.thr{position:relative;display:block;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:9px 34px 9px 12px;color:var(--text2);transition:background .15s}
.thr:hover{background:color-mix(in srgb,var(--sunken) 70%,transparent)}.thr.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line2),var(--hi)}
.thr b{display:block;font-weight:550;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thr small{display:block;font:11px/1.4 var(--fm);color:var(--faint);margin-top:2px}
.thr .tx{position:absolute;right:6px;top:8px;opacity:0;transition:opacity .15s}.thr:hover .tx,.thr.on .tx{opacity:1}
.chathead{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--line2)}.chathead .ttl{font:400 24px/1.1 var(--fd);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat{display:flex;flex-direction:column;gap:16px;height:max(300px,calc(100dvh - 400px));overflow:auto;padding:14px 4px 6px;scrollbar-width:thin}
.mwrap{display:flex;flex-direction:column;gap:4px;max-width:80%}.mwrap.user{align-self:flex-end;align-items:flex-end}.mwrap.agent{align-self:flex-start}.mwrap.system{align-self:center;align-items:center;max-width:90%}
.msg{padding:11px 15px;border-radius:14px;white-space:pre-wrap;line-height:1.58;overflow-wrap:anywhere}.msg.user{background:var(--ink);color:var(--on-ink);border-bottom-right-radius:5px}.msg.agent{background:var(--raise);border:1px solid var(--line2);border-bottom-left-radius:5px;box-shadow:var(--hi)}.msg.system{color:var(--mut);font-size:12.5px;padding:4px 10px}
.mwrap .ts{font-size:10.5px;color:var(--faint);padding:0 4px}
.prop{align-self:flex-start;display:flex;gap:8px;flex-wrap:wrap}

 const st=IST[i.status]||[i.status,''];return `<div class="job" style="grid-template-columns:1fr auto"><div><div class="jm">#${i.id}&ensp;&ensp;${esc(i.ts.replace('T',' ').slice(0,16))}</div><div style="margin-top:2px">${esc(i.text.slice(0,180))}</div>${res}${err}</div><div class="jr"><span class="tag ${st[1]}">${st[0]}</span>${['waiting','error'].includes(i.status)?`<button class="btn sm" onclick="run('inbox-retry','${i.id}')">Retry</button>`:''}</div></div>`}).join('')}</div>`:`<div class="empty">${ico('inbox')}<div>Nothing yet.</div></div>`}

let THREAD=0,THREADS=[];
function chatView(){return `<h2>Ask the agent</h2><p class="sub">Plain words or / commands. Each conversation keeps its own memory, and work I start in the background reports back to the conversation it came from. I never submit an application.</p>
 <div class="chatwrap"><div class="threads" id="threads"></div><div style="min-width:0"><div class="card" style="padding:18px 22px 16px"><div class="chathead"><div class="ttl" id="chat-title">Conversation</div><span class="grow"></span><button class="btn sm ghost" onclick="renameThread()">Rename</button></div><div class="chat" id="chatbox" aria-live="polite"></div>
 <div class="composer"><div id="cmdmenu" class="cmdmenu" style="display:none"></div><input id="chat-in" style="flex:1;min-width:0" autocomplete="off" placeholder="Ask, or type / for commands: /linkedin datadog applied science" oninput="cmdHint()" onkeydown="chatKey(event)"><button class="btn pri" onclick="sendChat()">${ico('send',14)}Send</button></div>

 <button class="btn sm ghost" onclick="ask('What should I do today to improve my chances?')">What should I do today?</button></div></div>

function renderThreads(){const el=$('threads');if(!el)return;el.innerHTML=`<button class="btn sm newt" onclick="newThread()">${ico('pen',13)}New chat</button>`+THREADS.map(t=>`<button class="thr ${t.id==THREAD?'on':''}" onclick="openThread(${t.id})"><b>${esc(t.title||'Untitled')}</b><small>${esc(when(t.updated))} · ${t.n} message${t.n==1?'':'s'}</small><span class="tx btn sm ghost sq" role="button" tabindex="0" aria-label="Delete conversation" title="Delete conversation" onclick="event.stopPropagation();delThread(${t.id})">${ico('x',12)}</span></button>`).join('');
 const cur=THREADS.find(t=>t.id==THREAD);if($('chat-title'))$('chat-title').textContent=cur?(cur.title||'Untitled'):'Conversation'}
async function newThread(){const r=await post('/api/threads',{action:'new'});THREAD=r.id;await loadChat();if($('chat-in'))$('chat-in').focus()}
function openThread(id){THREAD=id;loadChat()}

async function loadCmds(){if(!CMDS.length){try{CMDS=(await api('/api/commands')).commands}catch(e){}}const g=$('cmdguide');if(!g)return;const groups={};CMDS.forEach(c=>(groups[c.group]=groups[c.group]||[]).push(c));
 g.innerHTML=`<p class="sub" style="margin-top:0">&lt;id or words&gt; is a job id (from <b>/top</b> or <b>/jobs</b>) or company/title words, e.g. <b>/referral datadog applied science</b>. If several jobs match, I list them and you repeat with an id. Click any command to put it in the box.</p>`+
  Object.keys(groups).map(k=>`<div style="margin:10px 0 4px;font-weight:600">${esc(k)}</div>`+groups[k].map(c=>`<div class="row" style="gap:10px;margin:3px 0;align-items:baseline"><a href="#" onclick="event.preventDefault();fillCmd('${esc(c.name)}')" style="font-family:ui-monospace,Consolas,monospace;white-space:nowrap">${esc(c.usage)}</a><span class="sub" style="margin:0">${esc(c.desc)}</span></div>`).join('')).join('')+
  `<p class="sub">Plain words work too: <i>"scout LinkedIn for people at Stripe for the SWE intern role"</i> runs <b>/linkedin</b> for you. Prep actions start right away; <b>fill</b>, <b>mark</b> and <b>agent</b> only run when your words ask for them, otherwise I show a confirm button.</p>`}

 m.innerHTML=hits.map(c=>`<div class="cmdopt" onmousedown="event.preventDefault();fillCmd('${esc(c.name)}')"><b>${esc(c.usage)}</b><span>${esc(c.desc)}</span></div>`).join('');m.style.display=hits.length?'block':'none'}

async function sendChat(){const t=$('chat-in').value.trim();if(!t)return;const r=await post('/api/chat',{text:t,thread:THREAD});if(r.error){toast(esc(r.error));return}$('chat-in').value='';$('cmdmenu').style.display='none';loadChat();setTimeout(loadChat,1200)}
async function loadChat(){const r=await api('/api/chat'+(THREAD?'?thread='+THREAD:''));const b=$('chatbox');if(!b)return;const sw=THREAD!=r.thread||b.dataset.t!=String(r.thread);THREAD=r.thread;THREADS=r.threads||[];b.dataset.t=r.thread;renderThreads();const near=sw||b.scrollHeight-b.scrollTop-b.clientHeight<80;
 b.innerHTML=(r.messages.map(m=>{if(m.role=='proposal'){let ps=[];try{ps=JSON.parse(m.text)}catch(e){}return `<div class="prop">${ps.map(p=>`<button class="btn sm" onclick='runProposal(${JSON.stringify(p.kind)},${JSON.stringify(p.arg)})'>Run: ${esc(p.kind)} ${esc(p.arg.slice(0,48))}</button>`).join('')}</div>`}return `<div class="mwrap ${esc(m.role)}"><div class="msg ${esc(m.role)}">${fmtMsg(m.text)}</div><span class="ts" title="${esc((m.ts||'').replace('T',' '))}">${esc(when(m.ts))}</span></div>`}).join('')||`<div class="empty"><div class="big">A fresh conversation.</div><div>Ask about your pipeline or a company, or type / for commands.</div></div>`)+(r.busy?'<div class="mwrap agent"><div class="msg agent" aria-label="The agent is thinking"><span class="typing"><i></i><i></i><i></i></span></div></div>':'');
 if(near||r.busy)b.scrollTop=b.scrollHeight;clearTimeout(chatTimer);if($('chatbox'))chatTimer=setTimeout(loadChat,r.busy?2000:6000)}

async function loadUsage(){const u=await api('/api/usage');const el=$('u-body');if(!el)return;const tab=rows=>`<table><tr><th>Provider</th><th>Task</th><th class="num">Calls</th><th class="num">Tokens in</th><th class="num">Tokens out</th><th class="num">~Cost</th><th class="num">Time</th></tr>${rows.map(r=>`<tr><td>${esc(r.provider)}</td><td>${esc(r.kind)}</td><td class="num">${r.calls}</td><td class="num">${r.tin.toLocaleString()}</td><td class="num">${r.tout.toLocaleString()}</td><td class="num">$${r.cost}</td><td class="num">${r.secs}s</td></tr>`).join('')||'<tr><td colspan=7 class="tm">no calls</td></tr>'}</table>`;
 const days=[...new Set(u.daily.map(d=>d.day))];const max=Math.max(1,...days.map(d=>u.daily.filter(x=>x.day==d).reduce((a,x)=>a+x.tokens,0)));
 const bars=days.map(d=>{const t=u.daily.filter(x=>x.day==d).reduce((a,x)=>a+x.tokens,0);return `<div title="${d}: ${t.toLocaleString()} tokens"><i style="height:${Math.round(t/max*100)}%"></i></div>`}).join('');

 t.innerHTML=`<h4>${s[1]}</h4><p>${s[2]}</p><div class="row"><span class="tm">${TOURI+1} / ${TOUR.length}</span><span class="grow"></span><button class="btn sm ghost" onclick="endTour()">Skip</button>${TOURI?'<button class="btn sm" onclick="TOURI--;tourStep()">Back</button>':''}<button class="btn sm pri" onclick="${TOURI==TOUR.length-1?'endTour()':'TOURI++;tourStep()'}">${TOURI==TOUR.length-1?'Done':'Next'}</button></div>`;

<script>
/* ---------- command palette: Ctrl/Cmd+K. Views, jobs, actions and every slash command in one place. */
let PAL=[],PALI=0;
function openPal(){$('pal').classList.add('on');$('pal-in').value='';if(!CMDS.length)api('/api/commands').then(r=>{CMDS=r.commands;palRender()}).catch(()=>{});palRender();setTimeout(()=>$('pal-in').focus(),10)}
function closePal(){$('pal').classList.remove('on')}
function palItems(q){
  const ql=q.toLowerCase().trim(),out=[];
  if(ql.startsWith('/')){CMDS.filter(c=>('/'+c.name).startsWith(ql.split(' ')[0])).forEach(c=>out.push({g:'Commands',t:c.usage,d:c.desc,run:()=>{const v=ql.includes(' ')?q.trim():'/'+c.name+' ';if(v.endsWith(' ')){go('chat');setTimeout(()=>{$('chat-in').value=v;$('chat-in').focus();cmdHint()},60)}else{go('chat');post('/api/chat',{text:v,thread:THREAD}).then(()=>{loadChat();setTimeout(loadChat,1200)})}}}));return out}
  NAV.filter(n=>n.length>1&&(!ql||n[1].toLowerCase().includes(ql))).forEach(n=>out.push({g:'Go to',t:n[1],ic:n[2],run:()=>go(n[0])}));
  [['Run pipeline now',()=>run('cycle'),'Polls, reads, prepares; never submits'],['Open agent browser',()=>post('/api/open-browser',{}).then(()=>toast('Opened the agent browser: log in there once')),'LinkedIn and YC logins live there'],
   ['Ask the agent',()=>go('chat'),'Plain words or / commands'],['Switch light / dark',()=>toggleTheme(),'']].filter(a=>!ql||a[0].toLowerCase().includes(ql)).forEach(a=>out.push({g:'Actions',t:a[0],d:a[2],run:a[1]}));
  if(ql.length>1)S.jobs.filter(j=>(j.company+' '+j.title+' '+(j.location||'')).toLowerCase().includes(ql)).slice(0,8).forEach(j=>out.push({g:'Jobs',t:j.title,d:j.company+(j.location?', '+j.location.slice(0,40):''),run:()=>openDrawer(j.id)}));
  if(!ql)out.push({g:'Tip',t:'Type / to run a command, e.g. /linkedin stripe',d:'',run:()=>{$('pal-in').value='/';palRender()}});
  return out}
function palRender(){PAL=palItems($('pal-in').value);PALI=0;let g='';$('pal-list').innerHTML=PAL.map((x,i)=>{const h=x.g!=g?`<div class="pg">${esc(x.g)}</div>`:'';g=x.g;return h+`<div class="po${i==PALI?' sel':''}" data-i="${i}" onmouseenter="palSel(${i})" onclick="palGo(${i})">${x.ic?ico(x.ic):''}<span>${esc(x.t)}</span><small>${esc(x.d||'')}</small></div>`}).join('')||'<div class="pg">Nothing matches. Try a company name or a / command.</div>'}
function palSel(i){PALI=i;document.querySelectorAll('#pal .po').forEach(e=>e.classList.toggle('sel',+e.dataset.i==i))}
function palGo(i){const x=PAL[i];if(!x)return;closePal();x.run()}
function palKey(e){if(e.key=='ArrowDown'){e.preventDefault();palSel(Math.min(PAL.length-1,PALI+1))}else if(e.key=='ArrowUp'){e.preventDefault();palSel(Math.max(0,PALI-1))}else if(e.key=='Enter'){e.preventDefault();palGo(PALI)}else if(e.key=='Escape')closePal()}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();$('pal').classList.contains('on')?closePal():openPal()}});
document.querySelector('.search kbd').onclick=openPal;
</script>
