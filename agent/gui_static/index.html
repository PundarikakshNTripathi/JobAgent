<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobAgent</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--line:#e3e6ec;--text:#171a21;--mut:#667085;--acc:#4f46e5;--acc2:#6366f1;--accsoft:#eef0ff;--ok:#0f9d58;--oksoft:#e6f6ec;--warn:#b7791f;--warnsoft:#fdf3dc;--bad:#d92d20;--badsoft:#fde8e6;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06)}
:root[data-theme=dark]{--bg:#0d0f14;--panel:#151922;--panel2:#1b2030;--line:#252b3a;--text:#e8eaf0;--mut:#8b94a7;--acc:#7c83ff;--acc2:#9aa0ff;--accsoft:#1d2140;--ok:#3ecf8e;--oksoft:#112a20;--warn:#f0b429;--warnsoft:#2d2410;--bad:#ff6b5e;--badsoft:#34171a;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 14px;font-weight:700;font-size:16px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#22d3ee);display:grid;place-items:center;color:#fff;font-weight:800}
.grp{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);padding:12px 10px 4px;font-weight:700}
nav button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:9px;padding:8px 10px;text-align:left;color:var(--mut);font-weight:500}
nav button:hover{background:var(--panel2);color:var(--text)}nav button.on{background:var(--accsoft);color:var(--acc);font-weight:600}
nav .ico{width:18px;text-align:center}nav .n{margin-left:auto;font-size:11px;background:var(--panel2);color:var(--mut);border-radius:20px;padding:1px 8px;font-weight:600}nav button.on .n{background:var(--acc);color:#fff}
.side-foot{margin-top:14px;padding:10px;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-size:12px}
main{padding:0 28px 70px;min-width:0}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 82%,transparent);padding:14px 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;box-shadow:var(--shadow)}.search:before{content:"\1F50D";position:absolute;left:11px;top:9px;font-size:13px;opacity:.6}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;box-shadow:var(--shadow)}.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:var(--acc2)}.btn.ok{background:var(--oksoft);color:var(--ok);border-color:transparent}.btn.warn{background:var(--warnsoft);color:var(--warn);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12px;box-shadow:none}.btn.ghost{background:transparent;box-shadow:none}.btn[disabled]{opacity:.5;cursor:default}
.menu{position:relative}.pop{display:none;position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:30}
.menu.open .pop{display:block}.pop button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:8px 10px}.pop button:hover{background:var(--panel2)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--mut);font-weight:600}.chip.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--text);width:100%}textarea{resize:vertical;min-height:90px}
input[type=checkbox]{width:auto;accent-color:var(--acc)}select{width:auto;max-width:100%}
h2{font-size:20px;margin:6px 0 2px}h3{font-size:15px;margin:18px 0 6px}.sub{color:var(--mut);margin:0 0 14px}
.grid{display:grid;gap:12px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.job{display:grid;grid-template-columns:44px 1fr auto;gap:4px 14px;align-items:start}.job:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px}
.title{font-weight:650;font-size:15px;line-height:1.3}.title a{color:var(--text)}.title a:hover{color:var(--acc)}.co{color:var(--mut);font-size:12.5px;margin-bottom:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.pill{font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;background:var(--panel2);color:var(--mut)}
.pill.ok{background:var(--oksoft);color:var(--ok)}.pill.warn{background:var(--warnsoft);color:var(--warn)}.pill.bad{background:var(--badsoft);color:var(--bad)}.pill.acc{background:var(--accsoft);color:var(--acc)}
.why{grid-column:2/3;color:var(--mut);font-size:13px;margin-top:6px}.actions{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.score{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}.score small{display:block;font-size:9px;font-weight:600;color:var(--mut);margin-top:-2px}
.empty{padding:50px 10px;text-align:center;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer}.stat b{display:block;font-size:26px;line-height:1.1}.stat span{color:var(--mut);font-size:12px}
.sect{margin:22px 0 8px;font-weight:700;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut)}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}.task input{margin-top:4px;width:17px;height:17px}.task.done{opacity:.55}.task.done .tt{text-decoration:line-through}.tt{font-weight:600}.tm{color:var(--mut);font-size:12.5px;margin-top:2px}
.thought{background:var(--accsoft);color:var(--acc);border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{color:var(--mut);font-weight:600;font-size:12px}
td input,td select{padding:5px 8px}
.bar{height:8px;border-radius:6px;background:var(--acc);min-width:2px}.bars{display:flex;align-items:flex-end;gap:5px;height:70px}.bars div{flex:1;background:var(--accsoft);border-radius:4px 4px 0 0;position:relative}.bars div i{position:absolute;bottom:0;left:0;right:0;background:var(--acc);border-radius:4px 4px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.grow{flex:1 1 auto!important}
.field{display:grid;gap:4px;margin-bottom:10px}.field label{font-size:12px;color:var(--mut);font-weight:600}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}.badge.on{background:var(--oksoft);color:var(--ok)}.badge.off{background:var(--badsoft);color:var(--bad)}.badge.exp{background:var(--warnsoft);color:var(--warn)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;padding:4px}.msg{max-width:78%;padding:10px 14px;border-radius:14px;white-space:pre-wrap}.msg.user{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}.msg.agent{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}.msg.system{align-self:center;color:var(--mut);font-size:12px}
.prop{align-self:flex-start;display:flex;gap:8px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(5,8,16,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(780px,100vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(105%);transition:.25s;z-index:50;display:flex;flex-direction:column}.drawer.on{transform:none}
.dh{padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.dh .x{margin-left:auto}
.dt{display:flex;gap:4px;padding:10px 20px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow:auto}.dt button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--mut);font-weight:600;white-space:nowrap}.dt button.on{color:var(--acc);border-color:var(--acc)}
.db{padding:18px 22px 50px;overflow:auto;flex:1}
.md h1,.md h2,.md h3{margin:18px 0 6px}.md h1{font-size:20px}.md h2{font-size:16px}.md h3{font-size:14px}.md p,.md ul{margin:6px 0}.md ul{padding-left:20px}.md code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:12px}
.blk{position:relative;border-radius:8px;padding:4px 8px;margin:4px -8px}.blk:hover{background:var(--panel2)}.blk .cp{position:absolute;right:6px;top:4px;display:none}.blk:hover .cp{display:block}
pre.log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:70vh;overflow:auto;font-size:12px;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:95;align-items:center}.t{background:#111827;color:#fff;border-radius:10px;padding:9px 16px;font-weight:600;box-shadow:var(--shadow)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
.menu-btn{display:none}
.board{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}.fpanel{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto}
.fpanel select,.fpanel input:not([type=checkbox]):not([type=range]){width:100%}.fpanel input[type=range]{width:100%;padding:0}
.fchk{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--text);font-weight:500;padding:2px 0}.fchk input{width:auto}
@media(max-width:980px){.board{grid-template-columns:1fr}.fpanel{position:static;max-height:none}}
/* tour */
#tour{position:fixed;inset:0;z-index:100;display:none}#tour.on{display:block}
#tour .shade{position:absolute;inset:0;background:rgba(5,8,16,.62)}#tour .hole{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px rgba(5,8,16,.62);transition:.25s;pointer-events:none}
#tour .tip{position:absolute;width:min(360px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
#tour .tip h4{margin:0 0 6px;font-size:15px}#tour .tip p{margin:0 0 12px;color:var(--mut)}
.modal{position:fixed;inset:0;z-index:98;background:rgba(5,8,16,.6);display:none;place-items:center;padding:16px}.modal.on{display:grid}.modal .box{background:var(--panel);border-radius:16px;padding:22px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;z-index:60;transform:translateX(-105%);transition:.2s;width:250px}aside.on{transform:none}.menu-btn{display:inline-block}main{padding:0 14px 70px}.job{grid-template-columns:40px 1fr}.score{display:none}.actions,.why{grid-column:1/3}}
</style>
</head>
<body>
<div class="app">
<aside id="side"><div class="brand"><div class="logo">J</div>JobAgent</div><nav id="nav"></nav><div class="side-foot" id="foot">loading...</div></aside>
<main>
  <div class="top">
    <button class="btn menu-btn" onclick="document.getElementById('side').classList.toggle('on')">Menu</button>
    <div class="search" id="t-search"><input id="q" type="search" placeholder="Search company, title, location   ( / )" oninput="render()"></div>
    <button class="btn pri" id="cyc" onclick="run('cycle')">Run full cycle</button>
    <div class="menu" id="more"><button class="btn" onclick="document.getElementById('more').classList.toggle('open')">More</button>
      <div class="pop"><button onclick="run('poll')">Poll sources (free)</button><button onclick="run('triage')">Triage new postings</button><button onclick="run('scout')">Web scout (programs, X, careers)</button>
        <button onclick="run('today','--force')">Rebuild today's plan</button><button onclick="run('reflect')">Update agent memory now</button><button onclick="run('yc-profile')">Refresh YC profile</button><button onclick="startTour()">Take the tour</button><button onclick="toggleTheme()">Light / dark</button></div></div>
  </div>
  <div class="filters" id="filters"></div>
  <div id="view"></div>
</main>
</div>
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"><div class="dh" id="dh"></div><div class="dt" id="dt"></div><div class="db md" id="db"></div></div>
<div id="toast"></div>
<div id="tour"><div class="shade"></div><div class="hole" id="hole"></div><div class="tip" id="tip"></div></div>
<div class="modal" id="setup"><div class="box" id="setupbox"></div></div>
<script>
const H={'X-JobAgent':'1','Content-Type':'application/json'};
let S={jobs:[],programs:[],budget:{},running:[],plan:null,inbox_pending:0},VIEW='today',LOC='all',TIER='all',SORT='fit',CUR=null,DTAB='README',CFG=null,TOURI=0;
const NAV=[['Work'],['today','Today','☀'],['browse','All jobs','🔍'],['ready','Ready to submit','✅'],['fill','Needs you','✋'],['packet','Prepared','📄'],['match','Best matches','🎯'],['new','New','✨'],['applied','Applied','📨'],
 ['Network'],['watch','Watchlist','⭐'],['programs','Programs','🎓'],['Tools'],['inbox','Inbox','📥'],['chat','Ask the agent','💬'],['voice','My voice','✍'],
 ['Setup'],['usage','Usage & cost','📈'],['settings','Settings','⚙'],['help','Help','❓'],['log','Activity','📜']];
const COL=['#6366f1','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#14b8a6','#ec4899','#84cc16','#f97316'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col=s=>COL[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const $=id=>document.getElementById(id);
async function api(p,o){const r=await fetch(p,o);return r.json()}
const post=(p,b)=>api(p,{method:'POST',headers:H,body:JSON.stringify(b||{})});
function toast(m){const d=document.createElement('div');d.className='t';d.innerHTML=m;$('toast').appendChild(d);setTimeout(()=>d.remove(),3400)}
function toggleTheme(){const r=document.documentElement;const n=r.dataset.theme=='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('ja-theme',n)}catch(e){}}
try{document.documentElement.dataset.theme=localStorage.getItem('ja-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}
document.addEventListener('click',e=>{if(!e.target.closest('#more'))$('more').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key=='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('q').focus()}if(e.key=='Escape'){closeDrawer();endTour()}});

const sel={ready:j=>j.status=='ready',fill:j=>j.status.startsWith('fill-'),watch:j=>j.status=='watch',packet:j=>j.status=='packet',match:j=>j.status=='triaged'&&['APPLY','STRETCH'].includes(j.verdict),new:j=>j.status=='new'&&j.score>=65,applied:j=>j.status=='applied'};
const cnt=k=>k=='programs'?S.programs.length:k=='inbox'?(S.inbox_pending||''):(sel[k]?S.jobs.filter(sel[k]).length:'');
function nav(){$('nav').innerHTML=NAV.map(n=>n.length==1?`<div class="grp">${n[0]}</div>`:`<button id="nav-${n[0]}" class="${VIEW==n[0]?'on':''}" onclick="go('${n[0]}')"><span class="ico">${n[2]}</span>${n[1]}${cnt(n[0])!==''&&cnt(n[0])!==0?`<span class="n">${cnt(n[0])}</span>`:''}</button>`).join('')}
function go(k){VIEW=k;$('side').classList.remove('on');render();if(k=='log')loadLog();if(k=='settings')loadSettings();if(k=='usage')loadUsage();if(k=='inbox')loadInbox();if(k=='chat')loadChat();if(k=='voice')loadVoice()}
function filters(){const f=$('filters');if(!sel[VIEW]){f.innerHTML='';return}const c=(cur,set,opts)=>opts.map(([v,l])=>`<button class="chip ${cur==v?'on':''}" onclick="${set}='${v}';render()">${l}</button>`).join('');
 f.innerHTML=c(LOC,'LOC',[['all','All locations'],['india','Home country'],['remote','Remote'],['relocate','Relocate']])+'<span style="width:8px"></span>'+c(TIER,'TIER',[['all','All tiers'],['SA','Tier S/A']])+`<span style="flex:1"></span><select onchange="SORT=this.value;render()"><option value="fit" ${SORT=='fit'?'selected':''}>Best fit</option><option value="new" ${SORT=='new'?'selected':''}>Newest</option></select>`}
function ring(j){const v=Math.round(j.fit??j.score);const c=v>=65?'var(--ok)':v>=45?'var(--warn)':'var(--mut)';return `<div class="score" style="background:conic-gradient(${c} ${v*3.6}deg,var(--panel2) 0)"><div style="background:var(--panel);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;line-height:1">${v}<small>${j.fit!=null?'fit':'match'}</small></div></div>`}
function primary(j){if(j.status=='ready')return `<a class="btn pri sm" href="${esc(j.url)}" target="_blank">Open posting</a>`;
 if(j.status=='packet'||j.status.startsWith('fill-'))return `<button class="btn pri sm" onclick="run('fill','${esc(j.id)}')">Fill the form</button>`;
 if(j.status=='watch')return `<button class="btn pri sm" onclick="run('referral','${esc(j.id)}')">Plan referral</button>`;
 return `<button class="btn pri sm" onclick="run('packet','${esc(j.id)}')">Prepare application</button>`}
function reasonSkip(id){const r=prompt('Why skip? (optional, teaches the agent: e.g. "too senior", "not interested in this domain", "location")','');if(r===null)return;run('mark',id+' skip '+r)}
function card(j){const loc=j.loc_class=='india'?['Home','ok']:j.loc_class=='remote'?['Remote','acc']:['Relocate','warn'];const v=j.visa=='yes'?['visa sponsored','ok']:j.visa=='no'?['no sponsorship','bad']:null;
 return `<div class="card job"><div class="av" style="background:${col(j.company)}">${esc(j.company[0]||'?')}</div>
 <div><div class="co">${esc(j.company)} &middot; tier ${esc(j.tier)} &middot; ${esc(j.ats)}</div><div class="title"><a href="#" onclick="openDrawer('${esc(j.id)}');return false">${esc(j.title)}</a></div>
 <div class="chips"><span class="pill ${loc[1]}">${loc[0]}</span><span class="pill">${esc((j.location||'').slice(0,46))}</span>${v?`<span class="pill ${v[1]}">${v[0]}</span>`:''}${j.verdict?`<span class="pill ${j.verdict=='APPLY'?'ok':'warn'}">${j.verdict}</span>`:''}${j.has_ref?'<span class="pill acc">referral plan</span>':''}${j.resume?`<span class="pill">resume: ${esc(j.resume)}</span>`:''}</div></div>${ring(j)}
 <div class="why">${esc(j.reason||j.watch_note||'')}${j.yoe_gap?` <i>Gap: ${esc(j.yoe_gap)}</i>`:''}</div>
 <div class="actions">${primary(j)}<a class="btn sm" href="${esc(j.url)}" target="_blank" rel="noopener">Posting &#8599;</a><button class="btn sm" onclick="openDrawer('${esc(j.id)}')">Details</button>${j.status!='watch'?`<button class="btn sm" onclick="run('referral','${esc(j.id)}')">Referral plan</button>`:''}
 <button class="btn ok sm" onclick="run('mark','${esc(j.id)} applied')">Mark applied</button><button class="btn warn sm" onclick="reasonSkip('${esc(j.id)}')">Skip</button></div></div>`}
function rows(){const q=$('q').value.toLowerCase();let r=S.jobs.filter(sel[VIEW]);if(LOC!='all')r=r.filter(j=>j.loc_class==LOC);if(TIER=='SA')r=r.filter(j=>['S','A'].includes(j.tier));
 if(q)r=r.filter(j=>(j.company+' '+j.title+' '+j.location).toLowerCase().includes(q));r.sort(SORT=='new'?(a,b)=>String(b.first_seen).localeCompare(String(a.first_seen)):(a,b)=>(b.fit??b.score)-(a.fit??a.score));return r}
function today(){const ready=S.jobs.filter(sel.ready),fill=S.jobs.filter(sel.fill),watch=S.jobs.filter(sel.watch),p=S.plan;let done={};try{done=JSON.parse(localStorage.getItem('ja-done-'+S.day)||'{}')}catch(e){}
 const stat=(n,l,k)=>`<div class="stat" onclick="go('${k}')"><b>${n}</b><span>${l}</span></div>`;const hr=new Date().getHours();
 let h=`<h2>Good ${hr<12?'morning':hr<18?'afternoon':'evening'}${S.name?', '+esc(S.name):''}</h2><p class="sub">${S.day} &middot; last sweep ${esc((S.last_poll||'-').replace('T',' '))} &middot; ${S.active.toLocaleString()} postings tracked</p>
 <div class="stats" id="t-stats">${stat(ready.length,'ready to submit','ready')}${stat(fill.length,'need a few fields','fill')}${stat(S.jobs.filter(sel.match).length,'best matches','match')}${stat(watch.length,'on the watchlist','watch')}${stat(S.jobs.filter(sel.new).length,'new strong matches','new')}</div>`;
 if(ready.length||fill.length)h+=`<div class="sect">Waiting for you</div><div class="grid">${[...ready,...fill].slice(0,6).map(card).join('')}</div>`;
 if(p){h+=`<div class="sect">Today's plan <span style="text-transform:none;letter-spacing:0;font-weight:500">- tick them off</span></div>`+(p.tasks||[]).map((t,i)=>`<label class="task ${done['t'+i]?'done':''}"><input type="checkbox" ${done['t'+i]?'checked':''} onchange="tick('t${i}',this.checked)"><div><div class="tt">${esc(t.title)} <span class="pill">${t.minutes} min</span></div><div class="tm">${esc(t.why)}</div><div class="tm"><b>Proof:</b> ${esc(t.proof)}</div></div></label>`).join('');
  if((p.outreach||[]).length)h+=`<div class="sect">Outreach today</div>`+p.outreach.map((o,i)=>`<label class="task ${done['o'+i]?'done':''}"><input type="checkbox" ${done['o'+i]?'checked':''} onchange="tick('o${i}',this.checked)"><div><div class="tt">${esc(o.who_or_where)}</div><div class="tm">${esc(o.action)}</div></div></label>`).join('');
  if(p.thought)h+=`<div class="thought">${esc(p.thought)}</div>`}else h+=`<div class="empty">No plan yet. <button class="btn sm" onclick="run('today','--force')">Build today's plan</button></div>`;
 if(watch.length)h+=`<div class="sect">High-stakes watchlist (relationship first)</div><div class="grid">${watch.slice(0,4).map(card).join('')}</div>`;return h}

  <div class="field"><label>Minimum match: <b id="b-ms">${BF.minscore}</b></label><input type="range" min="0" max="95" step="5" value="${BF.minscore}" oninput="$('b-ms').textContent=this.value" onchange="bset('minscore',+this.value)"></div>

  <div><div class="row" style="margin-bottom:10px"><span class="grow"></span><span class="tm">Sort</span><select onchange="bset('sort',this.value)">${[['fit','Best match'],['new','Newest'],['company','Company A-Z'],['score','Heuristic score']].map(([v,l])=>`<option value="${v}" ${BF.sort==v?'selected':''}>${l}</option>`).join('')}</select><select onchange="BF.per=+this.value;bset('page',1)">${[10,25,50,100].map(n=>`<option ${BF.per==n?'selected':''}>${n}</option>`).join('')}</select></div>

function rowCard(j){const loc=j.loc_class=='india'?['Home','ok']:j.loc_class=='remote'?['Remote','acc']:['Relocate','warn'];const v=j.visa=='yes'?['sponsors visa','ok']:j.visa=='no'?['no sponsorship','bad']:null;

 <div class="why">${esc(j.analysed?(j.reason||''):(j.snippet||'').slice(0,220))}</div>

async function loadBrowse(first){if(!FAC)FAC=await api('/api/facets');if(first&&!$('b-list'))return;const r=await api('/api/jobs?'+bq());BR=r;const el=$('b-list');if(!el)return;

function chatView(){return `<h2>Ask the agent</h2><p class="sub">Ask about your matches, who to contact, what to do this week. It knows your profile, memory and pipeline. It only <i>proposes</i> actions; you confirm each one.</p>

 const sc=CFG.schedule;const num=(id,v,w=80)=>`<input id="${id}" type="number" value="${v}" style="width:${w}px">`;const chk=(id,v)=>`<input id="${id}" type="checkbox" ${v?'checked':''}>`;
 el.innerHTML=`<h3>Model providers</h3><div class="two">${pcards}</div><div class="tm" style="margin-top:6px">API providers need their key in an environment variable (shown when not ready). Antigravity (agy) and Claude Code work with your logged-in subscriptions.</div>

  <button class="btn pri" onclick="saveAuto()">Save settings</button></div>`}

 await post('/api/settings',{patch:{auto_fill:g('s-autofill').checked,max_fills_per_day:n('s-fills'),fill_window_local_hours:[n('s-fh0'),n('s-fh1')],max_triage_calls_per_day:n('s-tri'),triage_batch_size:n('s-batch'),max_packets_per_day:n('s-pk'),max_referrals_per_day:n('s-rf'),
 linkedin_browse:g('s-li').checked,max_linkedin_per_day:n('s-lim'),scout_every_days:n('s-scout'),min_heuristic_score_for_llm:n('s-min'),packet_min_fit:n('s-pmf'),humanize:{enabled:g('s-hum').checked},memory:{enabled:g('s-mem').checked},web:{search_backend:g('s-web').value},

function helpView(){return `<h2>Help</h2><p class="sub">Everything in two minutes. <button class="btn sm pri" onclick="startTour()">Take the guided tour</button></p><div class="two">
 <div class="card"><h3 style="margin-top:0">The loop</h3><div class="md"><p>JobAgent polls hundreds of company job boards, filters them against your profile, asks a model to judge the best ones, prepares a cover letter and answers, plans who to contact for a referral, and can fill the form. <b>You press Submit.</b></p></div></div>

 <div class="card"><h3 style="margin-top:0">Found something yourself?</h3><div class="md"><p>Use <b>Inbox</b>: paste a link or text plus your context. Or just tell the <b>Ask the agent</b> chat. Your items jump the queue.</p></div></div>
 <div class="card"><h3 style="margin-top:0">Messages that sound like you</h3><div class="md"><p>Paste messages you really sent in <b>My voice</b>, and the draft→final edits you make. Drafts are also linted for AI tells (stock phrases, dashes, lists) and rewritten when needed.</p></div></div>
 <div class="card"><h3 style="margin-top:0">Which model?</h3><div class="md"><p><b>Settings → Which model does which job</b>. Use any mix: Claude Code, Antigravity/Gemini, Codex, Gemini CLI, any OpenAI-compatible API, Ollama, Hermes, oh-my-pi, or a custom command. Form filling and LinkedIn need a browser-capable provider. Use <i>Benchmark</i> to compare providers on your own data.</p></div></div>
 <div class="card"><h3 style="margin-top:0">Safety</h3><div class="md"><ul><li>Forms are filled, <b>never submitted</b> (a page guard enforces it).</li><li>LinkedIn is read-only; <b>you send every message</b>.</li><li>Prestige roles go to the <b>Watchlist</b>: referral first, never auto-applied.</li><li>Your data stays in your workspace folder on this machine.</li></ul></div></div>
 <div class="card"><h3 style="margin-top:0">Keyboard</h3><div class="md"><p><code>/</code> search &middot; <code>Esc</code> close panels</p></div></div></div>`}

 else{const r=rows(),t=NAV.find(n=>n[0]==VIEW)[1];v.innerHTML=`<h2>${t}</h2><p class="sub">${r.length} shown</p><div class="grid">${r.slice(0,120).map(card).join('')||'<div class="empty">Nothing here yet.</div>'}</div>`}

/* ---------- drawer */
function md(t){const lines=t.split('\n');let h='',list=false,para=[];const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank">$1</a>');
 const flush=()=>{if(para.length){const txt=para.join(' ');h+=`<div class="blk"><p>${inl(txt)}</p><button class="btn sm cp" onclick="cp(this)" data-t="${esc(txt)}">Copy</button></div>`;para=[]}};const endl=()=>{if(list){h+='</ul>';list=false}};
 for(const l of lines){if(/^#{1,3} /.test(l)){flush();endl();const n=l.match(/^#+/)[0].length;h+=`<h${n}>${inl(l.replace(/^#+ /,''))}</h${n}>`}else if(/^\s*[-*] /.test(l)){flush();if(!list){h+='<ul>';list=true}h+=`<li>${inl(l.replace(/^\s*[-*] /,''))}</li>`}else if(!l.trim()){flush();endl()}else{endl();para.push(l.trim())}}flush();endl();return h}

const DT=[['README','Application'],['COVER','Cover letter'],['REFERRAL','Referral & outreach'],['RESUME','Resume'],['FILL','Form fill report']];

 ${CUR.reason?`<p>${esc(CUR.reason)}</p>`:''}${CUR.snippet?`<h3>From the posting</h3><p class="tm" style="white-space:pre-wrap">${esc(CUR.snippet)}</p>`:''}
 <div class="row" style="margin-top:12px"><button class="btn pri" onclick="run('packet','${esc(CUR.id)}');closeDrawer()">Analyse &amp; prepare application</button><button class="btn" onclick="run('referral','${esc(CUR.id)}');closeDrawer()">Plan referral</button><button class="btn warn" onclick="reasonSkip('${esc(CUR.id)}');closeDrawer()">Skip</button></div>

 const t=r.files[DTAB]||'';b.innerHTML=t?(DTAB=='COVER'?`<div class="blk" style="white-space:pre-wrap">${esc(t)}<button class="btn sm cp" onclick="cp(this)" data-t="${esc(t)}">Copy</button></div>`:md(t)):`<div class="empty">Not generated yet.<br><br><button class="btn pri" onclick="run('${gen}','${esc(CUR.id)}');closeDrawer()">Generate</button></div>`}

 $('side').classList.add('on');el.scrollIntoView({block:'center'});const r=el.getBoundingClientRect(),h=$('hole'),t=$('tip');h.style.cssText=`left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px`;
 t.innerHTML=`<h4>${s[1]}</h4><p>${s[2]}</p><div class="row"><span class="tm">${TOURI+1} / ${TOUR.length}</span><span class="grow"></span><button class="btn sm ghost" onclick="endTour()">Skip</button>${TOURI?'<button class="btn sm" onclick="TOURI--;tourStep()">Back</button>':''}<button class="btn sm pri" onclick="${TOURI==TOUR.length-1?'endTour()':'TOURI++;tourStep()'}">${TOURI==TOUR.length-1?'Done':'Next'}</button></div>`;
 const tw=Math.min(360,innerWidth*.92);let left=s[3]=='right'?r.right+16:r.left;let top=s[3]=='right'?Math.max(12,r.top):r.bottom+16;if(left+tw>innerWidth-8)left=Math.max(8,innerWidth-tw-8);t.style.left=left+'px';t.style.top=Math.min(top,innerHeight-190)+'px'}

 <div class="field"><label>About you in 2-3 sentences: what you build, what you want next</label><textarea id="su-summary" rows="3"></textarea></div><div class="field"><label>Your strongest projects/experience, one per line ("Name: what it is + one measured result")</label><textarea id="su-projects" rows="4"></textarea></div>
