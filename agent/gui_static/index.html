<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobAgent</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#f7f7f8;--panel:#fff;--sunken:#f3f4f6;--line:#e5e7eb;--line2:#eef0f3;--text:#0f172a;--text2:#334155;--mut:#64748b;--acc:#4338ca;--acc-h:#3730a3;--acc-soft:#eef2ff;--ok:#047857;--ok-soft:#ecfdf5;--warn:#b45309;--warn-soft:#fffbeb;--bad:#b91c1c;--bad-soft:#fef2f2;--sh:0 1px 2px rgba(15,23,42,.04);--sh2:0 10px 30px rgba(15,23,42,.12)}
:root[data-theme=dark]{--bg:#0b0d12;--panel:#12151c;--sunken:#0e1117;--line:#232733;--line2:#1b1f29;--text:#e6e8ee;--text2:#c3c8d4;--mut:#8b93a5;--acc:#8b93ff;--acc-h:#a5acff;--acc-soft:#1a1d3a;--ok:#34d399;--ok-soft:#0d2a21;--warn:#fbbf24;--warn-soft:#2b2210;--bad:#f87171;--bad-soft:#2f1517;--sh:none;--sh2:0 10px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:244px 1fr;min-height:100%}
/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:650;font-size:15px;letter-spacing:-.01em}.brand img{width:26px;height:26px;border-radius:7px}
.grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:16px 10px 6px;font-weight:600}
nav button{width:100%;display:flex;align-items:center;gap:10px;height:34px;background:none;border:0;border-radius:8px;padding:0 10px;text-align:left;color:var(--text2);font-weight:500}
nav button svg{color:var(--mut)}nav button:hover{background:var(--sunken)}nav button.on{background:var(--acc-soft);color:var(--acc)}nav button.on svg{color:var(--acc)}
nav .n{margin-left:auto;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600}nav button.on .n{color:var(--acc)}
.side-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line2);color:var(--mut);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}.dot.off{background:var(--bad)}.dot.pause{background:var(--warn)}
/* main */
main{padding:0 36px 80px;min-width:0;max-width:1240px;width:100%;margin:0 auto}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:16px 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}.search svg{position:absolute;left:11px;top:10px;color:var(--mut)}
.search input{width:100%;height:36px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:0 12px 0 34px}
.search input:focus,input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 35%,transparent);outline-offset:0;border-color:var(--acc)}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-weight:500;font-size:13px;color:var(--text);white-space:nowrap;text-decoration:none!important}
.btn:hover{background:var(--sunken)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:var(--acc-h)}
.btn.ok{color:var(--ok)}.btn.warn{color:var(--warn)}.btn.sm{height:28px;padding:0 10px;font-size:12.5px}.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--sunken)}
.btn.sq{width:32px;padding:0;justify-content:center}.btn.sm.sq{width:28px}.btn[disabled]{opacity:.45;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:100%;min-height:34px}
select{width:auto;max-width:100%}textarea{resize:vertical;min-height:84px}input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--acc)}
.menu{position:relative;display:inline-block}.pop{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh2);padding:5px;min-width:200px;z-index:40}
.menu.open .pop{display:block}.pop button,.pop a{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;color:var(--text);font-size:13px;text-decoration:none}.pop button:hover,.pop a:hover{background:var(--sunken)}.pop hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:1;font-weight:500;padding:4px 7px;border-radius:6px;border:1px solid var(--line);color:var(--text2);background:transparent;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.tag.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}.badge.on{background:var(--ok-soft);color:var(--ok)}.badge.off{background:var(--bad-soft);color:var(--bad)}.badge.exp{background:var(--warn-soft);color:var(--warn)}
.pill{font-size:11.5px;font-weight:500;border-radius:20px;padding:2px 9px;background:var(--sunken);color:var(--text2)}
h2{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:10px 0 2px}h3{font-size:14px;font-weight:600;margin:22px 0 8px;letter-spacing:-.005em}.sub{color:var(--mut);margin:0 0 18px;max-width:78ch}
.sect{margin:26px 0 8px;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.tm{color:var(--mut);font-size:12.5px}code{background:var(--sunken);padding:1px 6px;border-radius:5px;font-size:12px}
/* banner */
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-weight:500}
/* panels / lists */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--sh)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.grid{display:grid;gap:14px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.job{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line2);align-items:start}.list .job:last-child{border-bottom:0}.job:hover{background:color-mix(in srgb,var(--sunken) 55%,transparent)}
.lg{position:relative;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.lg b{font-weight:650;font-size:16px;color:var(--c,#475569)}.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;background:#fff}.lg.sm{width:36px;height:36px;border-radius:9px}
.jt{font-weight:600;font-size:15px;line-height:1.35;letter-spacing:-.01em}.jt a{color:var(--text)}.jt a:hover{color:var(--acc);text-decoration:none}.jt svg{width:13px;height:13px;color:var(--mut);vertical-align:-1px;margin-left:3px}
.jm{color:var(--mut);font-size:13px;margin-top:1px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.why{color:var(--text2);font-size:13px;margin-top:9px;max-width:92ch}
.jr{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:150px}.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mt{display:flex;align-items:center;gap:9px;font-variant-numeric:tabular-nums}.mt b{font-size:18px;font-weight:650;letter-spacing:-.02em}.mt span{display:block;width:54px;height:5px;border-radius:5px;background:var(--line2);overflow:hidden}.mt i{display:block;height:100%;background:var(--acc);border-radius:5px}.mt small{color:var(--mut);font-size:11px;display:block;margin-top:-2px}
.empty{padding:60px 20px;text-align:center;color:var(--mut)}.empty svg{width:34px;height:34px;color:var(--line);margin-bottom:8px;stroke-width:1.4}
/* today */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:6px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:var(--sh)}.tile:hover{border-color:var(--acc)}
.tile span{display:block;color:var(--mut);font-size:12.5px}.tile b{display:block;font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line2)}.list .task:last-child{border-bottom:0}.task input{margin-top:4px;width:16px;height:16px}.task.done{opacity:.5}.task.done .tt{text-decoration:line-through}.tt{font-weight:550}
.thought{background:var(--acc-soft);color:var(--acc);border-radius:10px;padding:12px 16px;margin-top:14px;font-weight:500}
/* forms/tables */
.field{display:grid;gap:5px;margin-bottom:12px}.field>label{font-size:12px;color:var(--mut);font-weight:600}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.grow{flex:1 1 auto!important}
.fchk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text);padding:2px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:middle}th{color:var(--mut);font-weight:600;font-size:12px}td input,td select{min-height:30px;padding:3px 8px}
.bars{display:flex;align-items:flex-end;gap:5px;height:76px}.bars div{flex:1;background:var(--acc-soft);border-radius:4px 4px 0 0;position:relative;min-height:3px}.bars div i{position:absolute;bottom:0;left:0;right:0;background:var(--acc);border-radius:4px 4px 0 0}
.board{display:grid;grid-template-columns:268px minmax(0,1fr);gap:20px;align-items:start}.fpanel{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;padding:16px}
.achips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.achip{display:inline-flex;align-items:center;gap:6px;background:var(--acc-soft);color:var(--acc);border-radius:20px;padding:3px 6px 3px 10px;font-size:12px;font-weight:500}.achip button{background:none;border:0;color:inherit;padding:0 3px;line-height:1;font-size:14px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow:auto;padding:4px}.msg{max-width:80%;padding:10px 14px;border-radius:14px;white-space:pre-wrap}.msg.user{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}.msg.agent{align-self:flex-start;background:var(--sunken);border-bottom-left-radius:4px}.msg.system{align-self:center;color:var(--mut);font-size:12px}.prop{align-self:flex-start;display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;margin-bottom:14px}.seg button{border:0;background:none;border-radius:7px;padding:5px 12px;font-weight:500;color:var(--mut)}.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--sh)}
.steps{display:flex;gap:6px;flex-wrap:wrap}.st{display:inline-flex;gap:5px;align-items:center;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--sunken);color:var(--mut)}.st.done{background:var(--ok-soft);color:var(--ok)}.st svg{width:12px;height:12px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.4);opacity:0;pointer-events:none;transition:.2s;z-index:50}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(800px,100vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(105%);transition:.25s;z-index:60;display:flex;flex-direction:column;box-shadow:var(--sh2)}.drawer.on{transform:none}
.dh{padding:16px 22px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}.dh .x{margin-left:auto;display:flex;gap:8px}
.dt{display:flex;gap:2px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);overflow:auto}.dt button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 12px;color:var(--mut);font-weight:500;white-space:nowrap}.dt button.on{color:var(--acc);border-color:var(--acc)}
.db{padding:22px 26px 60px;overflow:auto;flex:1}
.md h1,.md h2,.md h3{margin:20px 0 6px}.md h1{font-size:20px}.md h2{font-size:16px}.md h3{font-size:14px}.md p,.md ul{margin:6px 0}.md ul{padding-left:20px}
.blk{position:relative;border-radius:8px;padding:4px 8px;margin:4px -8px}.blk:hover{background:var(--sunken)}.blk .cp{position:absolute;right:6px;top:4px;display:none}.blk:hover .cp{display:inline-flex}
pre.log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:70vh;overflow:auto;font-size:12px;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:95;align-items:center}.t{background:#0f172a;color:#fff;border-radius:9px;padding:9px 16px;font-weight:500;box-shadow:var(--sh2)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
.menu-btn{display:none}
#tour{position:fixed;inset:0;z-index:100;display:none}#tour.on{display:block}#tour .shade{position:absolute;inset:0}#tour .hole{position:absolute;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,12,20,.6);transition:.25s;pointer-events:none}
#tour .tip{position:absolute;width:min(360px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--sh2)}#tour .tip h4{margin:0 0 6px;font-size:15px}#tour .tip p{margin:0 0 12px;color:var(--mut)}
.modal{position:fixed;inset:0;z-index:98;background:rgba(10,12,20,.55);display:none;place-items:center;padding:16px}.modal.on{display:grid}.modal .box{background:var(--panel);border-radius:14px;padding:24px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:var(--sh2)}
@media(max-width:980px){.board{grid-template-columns:1fr}.fpanel{position:static;max-height:none}}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;z-index:70;transform:translateX(-105%);transition:.2s;width:260px;box-shadow:var(--sh2)}aside.on{transform:none}.menu-btn{display:inline-flex}main{padding:0 16px 80px}.job{grid-template-columns:40px minmax(0,1fr)}.jr{grid-column:1/3;flex-direction:row;align-items:center;justify-content:space-between}}
.cmdmenu{position:absolute;left:0;right:90px;bottom:100%;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);overflow:hidden;z-index:20}
.cmdopt{display:flex;flex-direction:column;gap:1px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line2)}.cmdopt:last-child{border-bottom:0}.cmdopt:hover{background:var(--acc-soft)}
.cmdopt b{font:600 12.5px ui-monospace,Consolas,monospace;color:var(--text)}.cmdopt span{font-size:12px;color:var(--mut)}
.msg a{color:inherit;text-decoration:underline;word-break:break-all}
</style>
</head>
<body>
<div class="app">
<aside id="side"><div class="brand"><img src="/favicon.svg" alt="">JobAgent</div><nav id="nav"></nav><div class="side-foot" id="foot">loading...</div></aside>
<main>
  <div class="top">
    <button class="btn sq menu-btn" onclick="document.getElementById('side').classList.toggle('on')" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="search" id="t-search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Search company, title, location   ( / )" oninput="render()"></div>
    <button class="btn pri" id="cyc" onclick="run('cycle')">Run pipeline now</button>
    <div class="menu" id="more"><button class="btn" onclick="toggleMenu(event,'more')">More <svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="pop"><button onclick="run('poll')">Poll sources (no tokens)</button><button onclick="run('triage')">Triage new postings</button><button onclick="run('scout')">Web scout</button><hr><button onclick="run('today','--force')">Rebuild today's plan</button><button onclick="run('reflect')">Update agent memory</button><button onclick="run('yc-profile')">Refresh YC profile</button><hr><button onclick="startTour()">Take the tour</button><button onclick="toggleTheme()">Light / dark</button></div></div>
  </div>
  <div id="banner"></div>
  <div id="filters"></div>
  <div id="view"></div>
</main>
</div>
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"><div class="dh" id="dh"></div><div class="dt" id="dt"></div><div class="db md" id="db"></div></div>
<div id="toast"></div>
<div id="tour"><div class="shade"></div><div class="hole" id="hole"></div><div class="tip" id="tip"></div></div>
<div class="modal" id="setup"><div class="box" id="setupbox"></div></div>
<script>
const H={'X-JobAgent':'1','Content-Type':'application/json'};
let S={jobs:[],programs:[],budget:{},running:[],plan:null,inbox_pending:0,cooldowns:{}},VIEW='today',LOC='all',TIER='all',SORT='fit',CUR=null,DTAB='README',CFG=null,TOURI=0,PICKS=[],PTAB='all';
const IC={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
 check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
 file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 spark:'<path d="M12 3l1.9 4.6 4.6 1.9-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
 star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.3L5.8 21 7 14.2 2 9.3l6.9-1z"/>',cap:'<path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
 inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"/>',msg:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>',

function helpView(){return `<h2>Help</h2><p class="sub">Everything in two minutes. <button class="btn sm pri" onclick="startTour()">Take the guided tour</button></p><div class="two">
 <div class="card"><h3 style="margin-top:0">The loop</h3><div class="md"><p>JobAgent polls hundreds of company career pages, filters them against your profile (including the years of experience in the job description), has a model judge the best ones, prepares a cover letter and answers, plans who to contact for a referral, and can fill the form. <b>You press Submit.</b></p></div></div>
 <div class="card"><h3 style="margin-top:0">Daily routine</h3><div class="md"><ul><li><b>Today</b>: read the plan, tick tasks.</li><li><b>Ready to submit</b>: review the filled form, submit, mark applied.</li><li><b>All jobs</b>: filter like a job board; every row links to the posting.</li><li><b>My picks</b>: everything you prepared yourself.</li></ul></div></div>
 <div class="card"><h3 style="margin-top:0">Found something yourself?</h3><div class="md"><p>Paste it in <b>Inbox</b>, or tell <b>Ask the agent</b>. Items are stored, so a quota hit never loses them.</p></div></div>
 <div class="card"><h3 style="margin-top:0">Messages that sound like you</h3><div class="md"><p>Add messages you really sent in <b>My voice</b>, and your draft-to-final edits. Drafts are also checked for AI tells.</p></div></div>
 <div class="card"><h3 style="margin-top:0">Which model?</h3><div class="md"><p><b>Settings</b> lets you route each task to Claude Code, Antigravity/Gemini, Codex, APIs or local models. If one runs out of quota, work pauses for it and falls back to another.</p></div></div>
 <div class="card"><h3 style="margin-top:0">Safety</h3><div class="md"><ul><li>Forms are filled, <b>never submitted</b>.</li><li>LinkedIn is read-only; <b>you send every message</b>.</li><li>Prestige roles go to the Watchlist.</li><li>Your data stays on this computer.</li></ul></div></div></div>`}
/* ---------- core render */
function renderBanner(){const cd=S.cooldowns||{};const ks=Object.keys(cd);$('banner').innerHTML=ks.length?`<div class="banner">${ico('clock')}<div>${ks.map(k=>`<b>${esc(k)}</b> has reached its usage limit and resumes at ${esc(cd[k])}.`).join(' ')} Background work is paused for it; your inbox items wait and retry on their own.</div></div>`:''}
function render(){nav();filters();renderBanner();const v=$('view');
 const cd=S.cooldowns||{};$('foot').innerHTML=`<div><span class="dot ${cd.claude?'pause':''}"></span>Claude ${cd.claude?'paused until '+cd.claude:'ready'}</div><div style="margin-top:4px"><span class="dot ${cd.agy?'pause':''}"></span>Antigravity ${cd.agy?'paused':'ready'}</div><div style="margin-top:8px">Today: ${S.budget.triage_calls||0} triage &middot; ${S.budget.packets||0} packets &middot; ${S.budget.referrals||0} referrals</div><div style="margin-top:4px">${S.running.length?`<span class="spin"></span>${esc(S.running.join(', '))}`:'Idle'}</div>`;
 $('cyc').innerHTML=S.running.includes('cycle')?`<span class="spin"></span>${esc(S.stage&&S.stage!='done'?S.stage:'Running')}...`:'Run pipeline now';
 const keep=['inbox','chat','voice','usage','settings','browse','picks'];if(keep.includes(VIEW)&&v.dataset.view==VIEW)return;v.dataset.view=VIEW;
 if(VIEW=='today')v.innerHTML=today();else if(VIEW=='browse'){v.innerHTML=browseView();loadBrowse(true)}else if(VIEW=='picks'){v.innerHTML=picksView();loadPicks()}else if(VIEW=='programs')v.innerHTML=programs();else if(VIEW=='inbox')v.innerHTML=inboxView();else if(VIEW=='chat')v.innerHTML=chatView();else if(VIEW=='voice')v.innerHTML=voiceView();
 else if(VIEW=='usage')v.innerHTML=usageView();else if(VIEW=='settings')v.innerHTML=settingsView();else if(VIEW=='help')v.innerHTML=helpView();else if(VIEW=='log')v.innerHTML='<h2>Activity</h2><p class="sub">Latest agent log</p><pre class="log" id="logbox"></pre>';
 else{const r=rows(),t=NAV.find(n=>n[0]==VIEW)[1];v.innerHTML=`<h2>${t}</h2><p class="sub">${r.length} shown</p>${jobsList(r.slice(0,150))}`}
 if(!keep.includes(VIEW))v.dataset.view=''}
async function load(){try{S=await api('/api/state');if(S.setup_needed)showSetup();render()}catch(e){}}
async function run(cmd,arg=''){const r=await post('/api/run',{cmd,arg});if(r.error)toast(esc(r.error));else toast('Started: '+esc(r.started));setTimeout(()=>{load();if(VIEW=='picks')loadPicks();if(VIEW=='inbox')loadInbox()},900)}
async function loadLog(){const t=await (await fetch('/api/log')).text();const b=$('logbox');if(b){b.textContent=t;b.scrollTop=b.scrollHeight}}
/* ---------- drawer */
function md(t){const lines=t.split('\n');let h='',list=false,para=[];const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
 const flush=()=>{if(para.length){const txt=para.join(' ');h+=`<div class="blk"><p>${inl(txt)}</p><button class="btn sm cp" onclick="cp(this)" data-t="${esc(txt)}">Copy</button></div>`;para=[]}};const endl=()=>{if(list){h+='</ul>';list=false}};
 for(const l of lines){if(/^#{1,3} /.test(l)){flush();endl();const n=l.match(/^#+/)[0].length;h+=`<h${n}>${inl(l.replace(/^#+ /,''))}</h${n}>`}else if(/^\s*[-*] /.test(l)){flush();if(!list){h+='<ul>';list=true}h+=`<li>${inl(l.replace(/^\s*[-*] /,''))}</li>`}else if(!l.trim()){flush();endl()}else{endl();para.push(l.trim())}}flush();endl();return h}
function cp(b){navigator.clipboard.writeText(b.dataset.t).then(()=>toast('Copied'))}
const DT=[['README','Application'],['COVER','Cover letter'],['REFERRAL','Referral & outreach'],['RESUME','Resume'],['FILL','Form fill report']];
async function findJob(id){let j=S.jobs.find(x=>x.id==id)||(BR.items||[]).find(x=>x.id==id)||PICKS.find(x=>x.id==id);if(j&&j.url)return j;const r=await api('/api/jobs?id='+encodeURIComponent(id)+'&hidden=1&per=5');return (r.items||[])[0]}
async function openDrawer(id){const j=await findJob(id);if(!j)return toast('Job not found');CUR=j;DTAB='README';
 $('dh').innerHTML=`${logo(j)}<div style="min-width:0"><div class="jm">${esc(j.company)} &middot; ${esc(j.location||'')}</div><div class="jt">${esc(j.title)}</div></div><div class="x"><a class="btn sm" href="${esc(j.url)}" target="_blank" rel="noopener">Open posting ${ico('ext',13)}</a><button class="btn sm ghost sq" onclick="closeDrawer()" aria-label="Close">${ico('x')}</button></div>`;
 $('drawer').classList.add('on');$('scrim').classList.add('on');drawerTab()}
async function drawerTab(){$('dt').innerHTML=DT.map(([k,l])=>`<button class="${DTAB==k?'on':''}" onclick="DTAB='${k}';drawerTab()">${l}</button>`).join('');
 const b=$('db');b.innerHTML='<span class="spin"></span>Loading';const r=await api('/api/packet?id='+encodeURIComponent(CUR.id));const gen={README:'packet',COVER:'packet',REFERRAL:'referral',RESUME:'resume',FILL:'fill'}[DTAB];
 if(!r.exists){b.innerHTML=`<div class="card"><div class="row"><a class="btn pri" href="${esc(CUR.url)}" target="_blank" rel="noopener">Open the job posting ${ico('ext',13)}</a>${CUR.verdict?`<span class="tag acc">AI review: ${esc(CUR.verdict)} ${Math.round(CUR.fit||0)}</span>`:'<span class="tag">Not analysed in depth yet</span>'}</div><div class="chips">${tags(CUR)}</div>
 ${CUR.reason?`<p>${esc(CUR.reason)}</p>`:''}${CUR.snippet?`<h3>From the posting</h3><p class="tm" style="white-space:pre-wrap">${esc(CUR.snippet)}</p>`:''}
 <div class="row" style="margin-top:14px"><button class="btn pri" onclick="run('packet','${esc(CUR.id)}');closeDrawer()">Analyse &amp; prepare application</button><button class="btn" onclick="run('referral','${esc(CUR.id)}');closeDrawer()">Plan referral</button><button class="btn warn" onclick="reasonSkip('${esc(CUR.id)}');closeDrawer()">Skip</button></div></div>`;return}
 const t=r.files[DTAB]||'';b.innerHTML=t?(DTAB=='COVER'?`<div class="blk" style="white-space:pre-wrap">${esc(t)}<button class="btn sm cp" onclick="cp(this)" data-t="${esc(t)}">Copy</button></div>`:md(t)):`<div class="empty">Not generated yet.<br><br><button class="btn pri" onclick="run('${gen}','${esc(CUR.id)}');closeDrawer()">Generate</button></div>`}
function closeDrawer(){$('drawer').classList.remove('on');$('scrim').classList.remove('on')}
/* ---------- tour + setup */
const TOUR=[['#nav-today','Today','Your daily home: headline numbers, forms waiting for you, the day\'s plan and outreach to do.','right'],['#nav-browse','All jobs','Browse every tracked posting like a job board, with filters for role, level, experience required, location and visa sponsorship.','right'],
 ['#nav-ready','Ready to submit','Applications the agent filled in a separate browser. You review and press Submit yourself.','right'],['#nav-picks','My picks','Everything you prepared yourself, with how far each one is.','right'],
 ['#nav-match','Best matches','Jobs worth applying to. Press "Prepare application" for the cover letter, answers and resume pick.','right'],['#nav-watch','Watchlist','Prestige roles are never auto-applied. Referral first.','right'],
 ['#nav-inbox','Inbox','Found a job elsewhere? Paste it here with your context. Nothing is lost if a model is out of quota.','right'],['#nav-chat','Ask the agent','Chat about your pipeline. It proposes actions; you confirm each.','right'],
 ['#nav-voice','My voice','Teach it how you write so drafts need little editing.','right'],['#nav-settings','Settings','Pick the model for each job, frequency, limits and budgets.','right'],['#cyc','Run pipeline now','Does everything once. A background scheduler can run it for you silently.','bottom']];
function startTour(){TOURI=0;$('tour').classList.add('on');tourStep()}
function endTour(){$('tour').classList.remove('on');try{localStorage.setItem('ja-tour','1')}catch(e){}}
function tourStep(){const s=TOUR[TOURI];const el=document.querySelector(s[0]);if(!el){TOURI++;if(TOURI<TOUR.length)return tourStep();return endTour()}
 $('side').classList.add('on');el.scrollIntoView({block:'center'});const r=el.getBoundingClientRect(),h=$('hole'),t=$('tip');h.style.cssText=`left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px`;
 t.innerHTML=`<h4>${s[1]}</h4><p>${s[2]}</p><div class="row"><span class="tm">${TOURI+1} / ${TOUR.length}</span><span class="grow"></span><button class="btn sm ghost" onclick="endTour()">Skip</button>${TOURI?'<button class="btn sm" onclick="TOURI--;tourStep()">Back</button>':''}<button class="btn sm pri" onclick="${TOURI==TOUR.length-1?'endTour()':'TOURI++;tourStep()'}">${TOURI==TOUR.length-1?'Done':'Next'}</button></div>`;
 const tw=Math.min(360,innerWidth*.92);let left=s[3]=='right'?r.right+16:r.left;let top=s[3]=='right'?Math.max(12,r.top):r.bottom+16;if(left+tw>innerWidth-8)left=Math.max(8,innerWidth-tw-8);t.style.left=left+'px';t.style.top=Math.min(top,innerHeight-190)+'px'}
function showSetup(){if($('setup').classList.contains('on'))return;$('setup').classList.add('on');$('setupbox').innerHTML=`<h2 style="margin-top:0">Welcome to JobAgent</h2><p class="sub">Tell it who you are. This stays on your machine, in <code>${esc(S.home)}</code>. You can refine everything later.</p>
 ${[['name','Full name'],['email','Email'],['phone','Phone (optional)'],['location','City, country'],['linkedin','LinkedIn URL (optional)'],['github','GitHub URL (optional)'],['website','Website / portfolio (optional)'],['education','Education (degree, school, expected graduation)'],['graduation','Graduation (YYYY-MM)'],['home_country','Country you are authorised to work in'],['resume_pdf','Path to your resume PDF (optional)']].map(([k,l])=>`<div class="field"><label>${l}</label><input id="su-${k}"></div>`).join('')}
 <div class="field"><label>About you in 2-3 sentences: what you build, what you want next</label><textarea id="su-summary" rows="3"></textarea></div><div class="field"><label>Your strongest projects/experience, one per line ("Name: what it is + one measured result")</label><textarea id="su-projects" rows="4"></textarea></div><button class="btn pri" onclick="saveSetup()">Save and start the tour</button>`}
async function saveSetup(){const keys=['name','email','phone','location','linkedin','github','website','education','graduation','home_country','resume_pdf','summary','projects'];const b={};keys.forEach(k=>b[k]=$('su-'+k).value);if(!b.name.trim())return toast('Name is required');await post('/api/setup',b);$('setup').classList.remove('on');toast('Profile saved');await load();startTour()}
load();setInterval(load,12000);setInterval(()=>{if(VIEW=='log')loadLog();if(VIEW=='inbox')loadInbox();if(VIEW=='picks')loadPicks()},5000);
api('/api/picks').then(p=>{PICKS=p;nav()}).catch(()=>{});
try{if(!localStorage.getItem('ja-tour'))setTimeout(()=>{if(!S.setup_needed)startTour()},900)}catch(e){}
</script>
